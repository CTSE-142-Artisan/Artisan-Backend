openapi: 3.0.3
info:
  title: Review Service API
  description: Post-purchase reviews for Global Artisan Marketplace
  version: 1.0.0

servers:
  - url: http://localhost:8083
    description: Local
  - url: https://review-service.example.com
    description: Production

paths:
  /api/reviews:
    post:
      summary: Create a review for a purchased listing
      tags: [Reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Buyer has not purchased the listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reviews/listing/{listingId}:
    get:
      summary: Get reviews for a listing
      tags: [Reviews]
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

  /api/reviews/listings:
    get:
      summary: Get reviews for multiple listings
      tags: [Reviews]
      parameters:
        - name: listingIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

  /api/reviews/summary/listing/{listingId}:
    get:
      summary: Get rating summary for a listing
      tags: [Reviews]
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Listing review summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingReviewSummaryResponse'

components:
  schemas:
    CreateReviewRequest:
      type: object
      required: [listingId, orderId, userId, rating]
      properties:
        listingId:
          type: string
        orderId:
          type: string
        userId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    ReviewResponse:
      type: object
      properties:
        id:
          type: string
        listingId:
          type: string
        orderId:
          type: string
        userId:
          type: string
        userDisplayName:
          type: string
        userAvatarUrl:
          type: string
        rating:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    ListingReviewSummaryResponse:
      type: object
      properties:
        listingId:
          type: string
        averageRating:
          type: number
          format: double
          nullable: true
        reviewCount:
          type: integer
          format: int64

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
