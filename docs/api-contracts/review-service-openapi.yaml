openapi: 3.0.3
info:
  title: Review Service API
  description: Post-purchase reviews for Global Artisan Marketplace
  version: 1.0.0

servers:
  - url: http://localhost:8083
    description: Local
  - url: https://review-service.example.com
    description: Production

paths:
  /api/reviews:
    post:
      summary: Create a review
      tags: [Reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Validation err
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reviews/listing/{listingId}:
    get:
      summary: Get reviews for a listing
      tags: [Reviews]
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

  /api/reviews/listings:
    get:
      summary: Get reviews for multiple listings
      tags: [Reviews]
      parameters:
        - name: listingIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

components:
  schemas:
    CreateReviewRequest:
      type: object
      required: [listingId, buyerId, rating, comment]
      properties:
        listingId:
          type: string
        buyerId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    ReviewResponse:
      type: object
      properties:
        id:
          type: string
        listingId:
          type: string
        buyerId:
          type: string
        buyerName:
          type: string
        rating:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        details:
          type: array
          items:
            type: string
